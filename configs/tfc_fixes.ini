// TFC Fixes - addons/tfc_fixes_mm/tfc_fixes.ini
//
// 1 = fix on, 0 = off. Read at every map start (and with tfx_reload).
// In the server console, "tfx" lists every fix and how often each one has
// stepped in; "tfx <name> 0" switches one off until the next map.
//
// The numbers are the AMX Mod X "Bug Fixes TFC" plugin's, for comparison.
// Do not run that plugin as well.

ghost_nails         1   // #1  nails that hit each other no longer hang in the air
flag_in_wall        1   // #2  a dropped flag cannot start inside a wall or ceiling
door_caltrops       1   // #7  opening a door no longer heals caltrop leg damage
teleport_death      1   // #8  dying on the entrance pad cancels the teleport
teleport_flag       1   // #9  picking up a flag mid-teleport cancels it
teleport_leaver     1   //     leaving the server mid-teleport cancels it
grenade_in_entity   1   // #11 a grenade stuck inside someone does not hit everyone at full strength
nailgren_ceiling    1   // #12 nail grenades stop short of the ceiling
mirv_walls          1   // #13 MIRV bomblets stay on the MIRV's side of a ceiling or floor
grenade_spawn       1   // #14 a grenade held at death drops at the body, not at your next spawn
dropitems_grenade   1   // #15 dropping or capturing a flag no longer deletes the grenade you are priming
zero_health         1   // #16 the "death bug" (alive on less than 1 health)
grenade_jump_fps    1   // #17 hand-grenade jumps push forward at any server fps
flag_toss           1   // #18 items can be dropped with a player or wall in front of you
stuck_menus         1   // #19 a menu left over from the last map is closed
push_fps            1   //     push pads launch you the same height at any server fps/tick

// push_fps tuning (every map, no map editing). Jump pads get a one-shot launch
// of pad-speed * push_scale; fans/updrafts (tall or toggled push fields) get
// sustained lift at pad-speed * push_fan_scale. push_max (0 = off) caps either,
// in u/s. Change live in the console with "tfx push_scale <v>" etc. Examples:
// push_scale 0.25 makes jump pads a quarter as strong; push_max 800 caps any
// launch at 800 u/s (~400-unit apex).
push_scale          1
push_fan_scale      1
push_max            0

// How many times each fix is written to fixes_trace.log per map (the count in
// "tfx" is always complete). 0 = never.
log_each            5
